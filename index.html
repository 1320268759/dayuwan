<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大鱼丸电竞 - 哈弗币出租</title>
  <style>
    * {box-sizing: border-box;margin: 0;padding: 0;font-family: "Microsoft YaHei", sans-serif;}
    body {background: #1a1a1d;color: #eee;padding: 20px;max-width: 600px;margin: 0 auto;}
    .container {background: #28282f;padding: 25px;border-radius: 12px;}
    h1 {text-align: center;color: #ffcc00;margin-bottom: 20px;font-size: 22px;}
    .section {margin-bottom: 18px;}
    label {display: block;margin-bottom: 6px;font-weight: bold;color: #ddd;}
    select, input, button {width: 100%;padding: 10px;border-radius: 6px;border: none;font-size: 15px;}
    select, input {background: #3c3c44;color: #fff;}
    button {background: #ff4444;color: #fff;font-weight: bold;cursor: pointer;margin-top: 10px;}
    button:hover {background: #ff2222;}
    .result {margin-top: 25px;padding: 15px;background: #1f1f25;border-radius: 8px;font-size: 16px;line-height: 1.6;}
    .result strong {color: #ffcc00;font-size: 18px;}
    .tip {font-size: 13px;color: #aaa;margin-top: 5px;}
    .skin-group {display: flex;flex-wrap: wrap;gap: 8px;margin-top: 6px;}
    .skin-item {background: #3c3c44;padding: 8px 10px;border-radius: 6px;cursor: pointer;user-select: none;flex: 1;min-width: 110px;text-align: center;}
    .skin-item.active {background: #ffcc00;color: #000;font-weight: bold;}
    #copyBtn {background: #00c853;margin-top: 12px;display: none;}
    #copyBtn:hover {background: #00a800;}
  </style>
</head>
<body>
<div class="container">
  <h1>大鱼丸电竞 · 哈弗币出租</h1>
  <div class="section">
    <label>保险箱格数</label>
    <select id="safeType">
      <option value="9">9格保险箱</option>
      <option value="6">6格保险箱</option>
      <option value="4">4格保险箱</option>
      <option value="2">2格保险箱</option>
    </select>
  </div>
  <div class="section">
    <label>体力等级</label>
    <select id="tiLi">
      <option value="7">7级</option><option value="6">6级</option><option value="5">5级</option><option value="4">4级</option>
    </select>
  </div>
  <div class="section">
    <label>负重等级</label>
    <select id="fuZhong">
      <option value="7">7级</option><option value="6">6级</option><option value="5">5级</option><option value="4">4级</option>
    </select>
  </div>
  <div class="section" id="daoPiSection">
    <label>付费刀皮</label>
    <div class="skin-group">
      <div class="skin-item">赤霄</div><div class="skin-item">怜悯</div><div class="skin-item">影锋</div><div class="skin-item">黑海</div>
      <div class="skin-item">北极星</div><div class="skin-item">信条</div><div class="skin-item">龙牙</div><div class="skin-item">暗星</div>
    </div>
    <div class="tip">可多选</div>
  </div>
  <div class="section" id="redPiSection">
    <label>角色红皮</label>
    <div class="skin-group">
      <div class="skin-item">能天使</div><div class="skin-item">黑·天际线</div><div class="skin-item">水墨云图</div>
      <div class="skin-item">维什戴尔</div><div class="skin-item">蚀金玫瑰</div><div class="skin-item">凌霄戍卫</div>
    </div>
    <div class="tip">可多选</div>
  </div>
  <div class="section">
    <label>武器砖皮</label>
    <select id="zhuanPi"><option value="yes">有</option><option value="no">无</option></select>
  </div>
  <div class="section">
    <label>哈弗币数量（m）</label>
    <input type="number" id="coin" placeholder="输入数字" min="0">
    <div class="tip">1m = 100万</div>
  </div>
  <button onclick="calc()">立即计算</button>
  <div class="result" id="result" style="display:none;"></div>
  <button id="copyBtn" onclick="copyResult()">📋 一键复制结果</button>
</div>
<script>
const allSkinItems = document.querySelectorAll('.skin-item');
allSkinItems.forEach(item => {
  item.addEventListener('click', () => {
    item.classList.toggle('active');
  });
});

let resultText = '';

function calc() {
  const safeType = document.getElementById('safeType').value;
  const tiLi = parseInt(document.getElementById('tiLi').value);
  const fuZhong = parseInt(document.getElementById('fuZhong').value);
  const zhuanPi = document.getElementById('zhuanPi').value;
  const coin = parseFloat(document.getElementById('coin').value) || 0;

  const daoPiList = Array.from(document.querySelectorAll('#daoPiSection .skin-item.active')).map(i => i.textContent);
  const redPiList = Array.from(document.querySelectorAll('#redPiSection .skin-item.active')).map(i => i.textContent);
  const daoPiText = daoPiList.length > 0 ? daoPiList.join('、') : '无';
  const redPiText = redPiList.length > 0 ? redPiList.join('、') : '无';
  const zhuanPiText = zhuanPi === 'yes' ? '有' : '无';

  const hasDaoPi = daoPiList.length >= 1;
  const hasTwoRed = redPiList.length >= 2;
  const totalLevel = tiLi + fuZhong;

  let base;
  if (safeType === '9') base = 40;
  else if (safeType === '6') base = 43;
  else if (safeType === '4') base = 46;
  else base = 46;

  let minus = 0;
  if (totalLevel > 12) minus += 1;
  if (hasDaoPi) minus += 1;
  if (hasTwoRed) minus += 1;
  if (zhuanPi === 'yes') minus += 1;

  let rate = base - minus;

  if (tiLi < 4 || fuZhong < 4) {
    resultText = `❌ 体力/负重低于4级，不予出租`;
    document.getElementById('result').innerHTML = resultText;
    document.getElementById('result').style.display = 'block';
    document.getElementById('copyBtn').style.display = 'none';
    return;
  }

  if (coin < 25) {
    resultText = `❌ 哈弗币低于25m，不予出租`;
    document.getElementById('result').innerHTML = resultText;
    document.getElementById('result').style.display = 'block';
    document.getElementById('copyBtn').style.display = 'none';
    return;
  }

  const money = (coin * 100 / rate).toFixed(2);
  resultText = `
保险箱：${safeType}格
体力等级：${tiLi}级
负重等级：${fuZhong}级
付费刀皮：${daoPiText}
角色红皮：${redPiText}
武器砖皮：${zhuanPiText}
哈弗币：${coin}m
出租比例：1:${rate}
出租价格：${money}元`.trim();

  let html = `✅ 出租比例：<strong>1:${rate}</strong><br>💰 哈弗币：${coin} m<br>💰 出租价格：<strong>${money} 元</strong>`;
  document.getElementById('result').innerHTML = html;
  document.getElementById('result').style.display = 'block';
  document.getElementById('copyBtn').style.display = 'block';
}

function copyResult() {
  if (!resultText) return;
  const textarea = document.createElement('textarea');
  textarea.value = resultText;
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('✅ 复制成功！');
}
</script>
</body>
</html>
